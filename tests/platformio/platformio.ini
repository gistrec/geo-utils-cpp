; Used by .github/workflows/embedded.yml:
;   pio ci examples/GeoUtils/GeoUtils.ino --lib=. --project-conf=tests/platformio/platformio.ini -e <env>
; Both cores below default to C++17 or newer, so no -std flags are needed.
; Platforms that still default to gnu++11 (espressif32@6 / Arduino core 2.x)
; need build_unflags/build_flags in the consumer's env: see README, "Embedded".

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

[env:rpipico]
; The registry's `raspberrypi` platform is Mbed-based (gnu++14); this fork
; provides the arduino-pico (earlephilhower) core, which is C++17-capable.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
