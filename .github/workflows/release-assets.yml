# Attaches the single-header amalgamation (geo.hpp) to every published
# GitHub release: generate from the release tag, smoke-test it by building
# and running the end-to-end example against it, then upload.

name: Release assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  single-header:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Generate the single header
        run: python3 tools/amalgamate.py -o geo.hpp

      - name: Smoke-test the amalgamation
        run: |
          mkdir -p smoke/geo
          cp geo.hpp smoke/geo/geo.hpp
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -Ismoke \
              examples/gps_track.cpp -o smoke/gps_track
          ./smoke/gps_track

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" geo.hpp --clobber
