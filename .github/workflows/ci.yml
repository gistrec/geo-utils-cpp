# Cross-platform / multi-compiler build & test.
#
# Configures, builds, and runs the full test suite (unit tests + examples
# registered as ctest) on:
#   - Ubuntu (gcc and clang)
#   - macOS  (AppleClang)
#   - Windows (MSVC)
#
# Extra Ubuntu jobs:
#   - sanitizers: the same test suite under ASan + UBSan (clang)
#   - single-header: generate the amalgamation and build the example with it
#   - fuzz-smoke: a short libFuzzer run over geo::decode (clang)
#
# Triggered automatically on push/PR to master/main; can also be run manually
# from the Actions tab in GitHub UI.

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Strict warnings on the GCC/Clang jobs: the headers and tests
          # must stay clean at -Wall -Wextra -Wpedantic, and -Werror keeps
          # it that way. MSVC is left at its default warning level.
          - name: ubuntu-gcc
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            cxxflags: -Wall -Wextra -Wpedantic -Werror
          - name: ubuntu-clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            cxxflags: -Wall -Wextra -Wpedantic -Werror
          - name: macos
            os: macos-latest
            cxxflags: -Wall -Wextra -Wpedantic -Werror
          - name: windows
            os: windows-latest

    runs-on: ${{ matrix.os }}

    env:
      CC:  ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - uses: actions/checkout@v6

      - name: Resolve runner image version (cache key)
        id: image
        shell: bash
        run: echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build-cmake/_deps
          # Include repo name in the key so a repo rename (which changes the
          # absolute work-dir path baked into FetchContent's subbuild cache)
          # invalidates stale caches automatically. Include the runner image
          # version so a toolchain bump (e.g. Windows switching its default
          # generator from "Visual Studio 17 2022" to "18 2026") invalidates the
          # cached googletest subbuild, which otherwise trips CMake's
          # generator-mismatch check.
          key: ${{ runner.os }}-${{ matrix.name }}-${{ github.event.repository.name }}-img${{ steps.image.outputs.version }}-googletest-1.14.0

      - name: Configure
        run: cmake -S . -B build-cmake -DGEO_UTILS_CPP_BUILD_TESTS=ON -DGEO_UTILS_CPP_BUILD_EXAMPLES=ON "-DCMAKE_CXX_FLAGS=${{ matrix.cxxflags }}"

      - name: Build
        run: cmake --build build-cmake --config Release

      - name: Test
        run: ctest --test-dir build-cmake -C Release --output-on-failure

  # The full test suite under AddressSanitizer + UndefinedBehaviorSanitizer.
  # -fno-sanitize-recover=all turns any UB report into a test failure.
  sanitizers:
    name: ubuntu-clang-asan-ubsan
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: >
          cmake -S . -B build-san
          -DGEO_UTILS_CPP_BUILD_TESTS=ON -DGEO_UTILS_CPP_BUILD_EXAMPLES=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -g -Wall -Wextra -Wpedantic -Werror"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-san -j

      - name: Test
        run: ctest --test-dir build-san --output-on-failure
        env:
          UBSAN_OPTIONS: print_stacktrace=1

  # The single-header amalgamation must stay generatable and usable — the
  # release workflow (release-assets.yml) attaches it to every release, and
  # a failure there would surface only after the release is public.
  single-header:
    name: single-header-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate and smoke-test
        run: |
          python3 tools/amalgamate.py -o geo.hpp
          mkdir -p smoke/geo
          cp geo.hpp smoke/geo/geo.hpp
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -Ismoke \
              examples/gps_track.cpp -o smoke/gps_track
          ./smoke/gps_track

  # Short libFuzzer run over geo::decode (the only parser of untrusted
  # input): memory safety under ASan/UBSan plus the encode/decode
  # round-trip property. A smoke check, not a soak — 60 seconds.
  fuzz-smoke:
    name: fuzz-decode-smoke
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: >
          cmake -S . -B build-fuzz
          -DGEO_UTILS_CPP_BUILD_TESTS=OFF -DGEO_UTILS_CPP_BUILD_EXAMPLES=OFF
          -DGEO_UTILS_CPP_BUILD_FUZZERS=ON

      - name: Build
        run: cmake --build build-fuzz -j

      - name: Fuzz
        run: ./build-fuzz/tests/fuzz/geo_utils_cpp_fuzz_decode -max_total_time=60 -print_final_stats=1
